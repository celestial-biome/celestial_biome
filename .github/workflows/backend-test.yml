name: Backend Tests

on:
  push:
    paths:
      - 'src/backend/**'  # バックエンドの変更時のみ実行
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'src/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        # Djangoの設定や環境変数は test_settings.py と conftest.py が処理するため
        # 追加の環境変数設定は不要です
        run: uv run pytest
