name: Backend Tests

on:
  push:
    paths:
      - 'src/backend/**'  # バックエンドの変更時のみ実行
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'src/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest
        # Djangoの設定や環境変数は test_settings.py と conftest.py が処理するため
        # 追加の環境変数設定は不要です
        run: uv run pytest
