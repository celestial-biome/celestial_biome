name: Frontend Tests

on:
  push:
    paths:
      - 'src/frontend/**'             # フロントエンドディレクトリの変更のみ監視
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'src/frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'          # プロジェクト規定のバージョン
          cache: 'npm'                # npmキャッシュを有効化して高速化
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                   # CI環境用のクリーンインストール

      - name: Run Vitest
        run: npm test                 # vitest の実行
