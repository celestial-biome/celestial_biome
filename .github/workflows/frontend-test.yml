name: Frontend Tests

on:
  push:
    paths:
      - 'src/frontend/**'             # フロントエンドディレクトリの変更のみ監視
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'src/frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'          # プロジェクト規定のバージョン
          cache: 'npm'                # npmキャッシュを有効化して高速化
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                   # CI環境用のクリーンインストール

      - name: Run Vitest
        run: npm test                 # vitest の実行
