name: Frontend Tests

on:
  push:
    paths:
      - 'src/frontend/**'             # フロントエンドディレクトリの変更のみ監視
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'src/frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'          # プロジェクト規定のバージョン
          cache: 'npm'                # npmキャッシュを有効化して高速化
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci                   # CI環境用のクリーンインストール

      - name: Run Vitest
        run: npm test                 # vitest の実行
