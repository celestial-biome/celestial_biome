name: CI (Lint & Format Check)

on:
  push:
    branches: ['main']
    paths:
      - 'src/**' # src配下の変更のみ検知
  pull_request:
    branches: ['main']
    paths:
      - 'src/**'

jobs:
  # ---------------------------------------------------
  # 1. Backend Check (Ruff & Ty)
  # ---------------------------------------------------
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Python 3.12 セットアップ
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      # uv のインストール
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      # 依存関係のインストール (Ruff, Ty を含むDev依存も入れる)
      - name: Install dependencies
        run: |
          cd src/backend
          uv sync --dev --frozen

      # Ruff による Lint チェック (バグや非推奨な書き方がないか)
      - name: Run Ruff Lint
        run: |
          cd src/backend
          uv run ruff check .

      # Ruff によるフォーマットチェック (形が崩れていないか)
      - name: Run Ruff Format Check
        run: |
          cd src/backend
          uv run ruff format --check .

      # Ty による静的型チェック (New!)
      - name: Run Ty Type Check
        run: |
          cd src/backend
          uv run ty check

  # ---------------------------------------------------
  # 2. Frontend Check (Biome)
  # ---------------------------------------------------
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Node.js 22 セットアップ
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # 依存関係のインストール
      - name: Install dependencies
        run: |
          cd src/frontend
          npm ci

      # Biome によるチェック (Lint & Format)
      - name: Run Biome CI
        run: |
          cd src/frontend
          npx biome ci .
