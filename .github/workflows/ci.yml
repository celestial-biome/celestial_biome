name: CI (Lint & Format Check)

on:
  push:
    branches: ['main']
    paths:
      - 'src/**' # src配下の変更のみ検知
  pull_request:
    branches: ['main']
    paths:
      - 'src/**'

jobs:
  # ---------------------------------------------------
  # 1. Backend Check (Ruff & Ty)
  # ---------------------------------------------------
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Python 3.12 セットアップ
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      # uv のインストール
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      # 依存関係のインストール (Ruff, Ty を含むDev依存も入れる)
      - name: Install dependencies
        run: |
          cd src/backend
          uv sync --dev --frozen

      # Ruff による Lint チェック (バグや非推奨な書き方がないか)
      - name: Run Ruff Lint
        run: |
          cd src/backend
          uv run ruff check .

      # Ruff によるフォーマットチェック (形が崩れていないか)
      - name: Run Ruff Format Check
        run: |
          cd src/backend
          uv run ruff format --check .

      # Ty による静的型チェック (New!)
      - name: Run Ty Type Check
        run: |
          cd src/backend
          uv run ty check

  # ---------------------------------------------------
  # 2. Frontend Check (Biome)
  # ---------------------------------------------------
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Node.js 22 セットアップ
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # 依存関係のインストール
      - name: Install dependencies
        run: |
          cd src/frontend
          npm ci

      # Biome によるチェック (Lint & Format)
      - name: Run Biome CI
        run: |
          cd src/frontend
          npx biome ci .
