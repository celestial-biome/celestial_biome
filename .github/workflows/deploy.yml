name: Deploy to Cloud Run

on:
  push:
    branches: ['main']

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  REPO_NAME: app-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      # 1. Google Cloud 認証
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      # 2. Docker 認証
      - name: 'Docker Auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # 3. Build & Push (Backend)
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}

      # DBマイグレーションの実行 イメージを更新してから実行
      - name: Run DB Migration
        run: |
          gcloud run jobs update migrate-job \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }}

          gcloud run jobs execute migrate-job --region ${{ env.REGION }} --wait

      # Cloud Run Jobs の更新 (Ingest と Sync)
      - name: Update Cloud Run Jobs
        run: |
          JOBS=("ingest-space-weather-job" "sync-space-weather-db-job" "ingest-earthquakes-job" "sync-earthquakes-db-job" "ingest-economy-job" "sync-economy-db-job")

          for job in "${JOBS[@]}"; do
            echo "Updating $job..."
            gcloud run jobs update "$job" \
              --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }} \
              --region ${{ env.REGION }} &
          done
          wait

      # 4. Deploy to Cloud Run (Backend)
      - name: Deploy Backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: celestial-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}

      # BackendのURLを動的に取得して環境変数にセットする
      - name: Get Backend URL
        run: |
          BACKEND_URL=$(gcloud run services describe celestial-backend --region ${{ env.REGION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "Backend URL is $BACKEND_URL"

      # 5. Build & Push (Frontend)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
          # フロントエンドのビルド時に、取得したURLを埋め込み、SentryのトークンとDSNも渡す
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.SENTRY_FRONTEND_DSN }}

      # 6. Deploy to Cloud Run (Frontend)
      - name: Deploy Frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: celestial-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${{ github.sha }}
