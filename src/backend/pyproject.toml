[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.7.1",
    "dj-database-url>=3.1.2",
    "Django~=6.0.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.30.0",
    "google-cloud-bigquery>=3.42.2",
    "gunicorn>=26.0.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pandas-gbq>=0.35.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "skyfield>=1.54",
    "sentry-sdk[django]>=2.64.0",
    "wbgapi>=1.0.14",
    "whitenoise>=6.12.0",
    "yfinance>=1.5.1",
    "firebase-admin>=7.5.0",
    "python-json-logger>=4.1.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["astronomy", "geology", "economy"]
addopts = "--nomigrations --reuse-db"

[tool.ruff]
# 除外するディレクトリ
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "**/migrations/*.py", # マイグレーションファイルはチェックしない
]

# 1行の文字数（Djangoは長くなりがちなので120くらいがおすすめ）
line-length = 120
indent-width = 4

[tool.ruff.lint]
# 有効にするルール
# E: pycodestyle errors
# W: pycodestyle warnings
# F: Pyflakes
# I: isort (importの並び順整理)
# B: flake8-bugbear
# DJ: flake8-django (Django固有のルール)
select = ["E", "W", "F", "I", "B", "DJ"]
ignore = []

# 自動修正可能なルール
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.src]
# チェック対象のディレクトリ
include = ["**/*.py"]
