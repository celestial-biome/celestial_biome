services:

  inference:
    build:
      # celestial_biome から見て 1 つ上の階層にある celestial-inference を指定
      context: ../celestial-inference/src/backend
      dockerfile: Dockerfile.dev
    volumes:
      # ホットリロードを有効にするため、別リポジトリのパスをマウント
      - ../celestial-inference/src/backend:/app
      - ~/.config/gcloud/application_default_credentials.json:/tmp/keys/gcp-creds.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/gcp-creds.json
      - GOOGLE_CLOUD_PROJECT=celestial-biome-480601
    ports:
      - "8001:8000"
    # 他のコンテナから名前解決できるように service 名を固定
    networks:
      - default

  # --- Backend (Django) ---
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.dev
    volumes:
      # 【Bind Mount】
      # PC上のコード編集を即座にコンテナに反映させるための設定（ホットリロード）。
      # これがないと、コードを変えるたびにビルドし直す必要があります。
      - ./src/backend:/app

      # 【File Mount / Credential Injection】
      # Google Cloudの認証ファイルを、PC（ホスト）から直接コンテナに貸し出しています。
      # :ro は "Read Only" の意味。コンテナ側が誤ってキーファイルを書き換える事故を防ぐ「プロの常套手段」
      - ~/.config/gcloud/application_default_credentials.json:/tmp/keys/gcp-creds.json:ro
    ports:
      - "8000:8000"
    environment:
      # Pythonに .pyc ファイル（バイトコード）を書き出させない設定
      - PYTHONDONTWRITEBYTECODE=1

      # Django が FastAPI を見つけるための名前解決設定を追加
      - INFERENCE_API_URL=http://inference:8000

      - DJANGO_SECRET_KEY=dev_secret_key
      - DEBUG=True
      # "db" はこのファイル内のサービス名を指します。Docker内部DNSが名前解決をしてくれます。
      - DATABASE_URL=postgres://user:password@db:5432/celestial_db

      # PythonのGCPライブラリは、この環境変数を見て認証ファイルを探しに行きます。
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/gcp-creds.json

      # ${VAR} は「ホストマシンの環境変数」または「.envファイル」から値を注入する記法です。
      # チーム開発でプロジェクトIDが変わる場合などに便利です。
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
    depends_on:
      inference:
        condition: service_started

      db:
        # 【重要】単にdbが起動するのを待つだけでなく、「ヘルスチェックがOKになるまで」待ちます。
        # これにより「DBは起動したけど接続準備ができてなくてDjangoが落ちる」現象を防げます。
        condition: service_healthy



  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./src/frontend:/app

      # 【Named Volume】
      # コンテナ内の /app/node_modules をこのボリュームに逃がします。
      # これにより、ホスト側の空の node_modules がコンテナ内を上書きしてエラーになるのを防ぎつつ、
      # コンテナ再作成時もインストール済みパッケージ(キャッシュ)を保持して高速化します。
      - node_modules_data:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # ブラウザが Django を叩くための URL (ホストマシンから見た URL)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Docker内部ネットワークでのBackendアドレス
      - INTERNAL_API_URL=http://backend:8000
      # Windowsや一部のLinux/Mac環境で、ファイルの変更検知がうまく動かない場合の保険。
      # CPU負荷は少し上がりますが、ホットリロードが確実に動くようになります。
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  # --- Database (PostgreSQL) ---
  db:
    # "alpine" は超軽量なLinux OS。イメージサイズを小さく抑えるための推奨タグです。
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      # PCのDB管理ツール（DBeaverなど）から接続するためにポートを開けています。
      - "5432:5432"
    volumes:
      # DBのデータを永続化します。コンテナを消してもデータは消えません。
      - postgres_data:/var/lib/postgresql/data

    # 【Healthcheck】
    # コンテナが「生きているか」だけでなく「正しく応答できるか」を定期的にチェックします。
    # ここでOKが出ないと、backend は起動を開始しません（depends_onの設定により）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d celestial_db"]
      interval: 5s  # 5秒ごとにチェック
      timeout: 5s   # 5秒応答がなければ失敗とみなす
      retries: 5    # 5回失敗したら「Unhealthy」と認定

volumes:
  postgres_data:
  node_modules_data:
